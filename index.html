<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joke Harm Annotation Tool</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>

<div id="setup-screen" class="screen">
  <div class="card">
    <h1>Joke Harm Annotation</h1>
    <label for="annotator-name">Your name / ID</label>
    <input type="text" id="annotator-name" placeholder="e.g. ahmed">

    <label for="language-select">Dataset</label>
    <select id="language-select">
      <option value="english">English jokes</option>
      <option value="arabic">Arabic jokes</option>
      <option value="images_english">English images</option>
      <option value="images_arabic">Arabic images</option>
      <option value="videos_english">English videos</option>
      <option value="videos_arabic">Arabic videos</option>
    </select>

    <button id="start-btn">Start / Resume</button>
    <p class="hint">Your progress is saved in this browser and resumes automatically next time you enter the same name.</p>
  </div>
</div>

<div id="annotation-screen" class="screen hidden">
  <header>
    <div id="progress-text">0 / 0 annotated</div>
    <div class="progress-bar"><div id="progress-fill"></div></div>
    <a id="docs-link" href="docs.html" target="_blank" rel="noopener" data-en="Documentation" data-ar="التوثيق">Documentation</a>
    <button id="switch-btn" data-en="Switch annotator/dataset" data-ar="تبديل المُصنِّف / المجموعة">Switch annotator/dataset</button>
  </header>

  <main>
    <div id="joke-text" class="joke-box"></div>
    <img id="joke-image" class="joke-box joke-image hidden" alt="">
    <video id="joke-video" class="joke-box joke-video hidden" controls></video>


    <div class="form-grid">
      <div class="field">
        <label data-en="Label" data-ar="التصنيف">Label</label>
        <select id="f-label">
          <option value="" data-en="-- select --" data-ar="-- اختر --">-- select --</option>
          <option value="safe" data-en="Safe" data-ar="آمن">Safe</option>
          <option value="harmful" data-en="Harmful" data-ar="ضار">Harmful</option>
        </select>
      </div>

      <div class="field">
        <label data-en="Explicitness" data-ar="درجة الوضوح">Explicitness</label>
        <select id="f-explicitness">
          <option value="" data-en="-- select --" data-ar="-- اختر --">-- select --</option>
          <option value="none" data-en="None" data-ar="بدون">None</option>
          <option value="explicit" data-en="Explicit" data-ar="صريح">Explicit</option>
          <option value="implicit" data-en="Implicit" data-ar="ضمني">Implicit</option>
        </select>
      </div>

      <div class="field">
        <label data-en="Harm category" data-ar="فئة الضرر">Harm category</label>
        <select id="f-harm-category">
          <option value="" data-en="-- select --" data-ar="-- اختر --">-- select --</option>
          <option value="safe" data-en="Safe" data-ar="آمن">Safe</option>
          <option value="racism_ethnicity_nationality" data-en="Racism / ethnicity / nationality" data-ar="عنصرية / عرقية / قومية">Racism / ethnicity / nationality</option>
          <option value="religion" data-en="Religion" data-ar="دين">Religion</option>
          <option value="gender_sexism" data-en="Gender / sexism" data-ar="جندر / تمييز جنسي">Gender / sexism</option>
          <option value="sexual_content_harassment" data-en="Sexual content / sexual harassment" data-ar="محتوى جنسي / تحرش جنسي">Sexual content / sexual harassment</option>
          <option value="disability_illness" data-en="Disability / illness" data-ar="إعاقة / مرض">Disability / illness</option>
          <option value="body_shaming_appearance" data-en="Body-shaming / appearance" data-ar="تنمر على المظهر / الجسد">Body-shaming / appearance</option>
          <option value="violence_death_trauma" data-en="Violence / death / trauma" data-ar="عنف / موت / صدمة">Violence / death / trauma</option>
          <option value="self_harm" data-en="Self-harm" data-ar="إيذاء الذات">Self-harm</option>
          <option value="class_poverty" data-en="Class / poverty" data-ar="طبقية / فقر">Class / poverty</option>
          <option value="age" data-en="Age" data-ar="العمر">Age</option>
          <option value="political_identity" data-en="Political identity" data-ar="الهوية السياسية">Political identity</option>
          <option value="other_unclear" data-en="Other / unclear" data-ar="أخرى / غير واضح">Other / unclear</option>
        </select>
      </div>

      <div class="field">
        <label data-en="Harm culture" data-ar="الثقافة المرتبطة بالضرر">Harm culture</label>
        <select id="f-harm-culture">
          <option value="" data-en="-- select --" data-ar="-- اختر --">-- select --</option>
          <option value="safe" data-en="Safe" data-ar="آمن">Safe</option>
          <option value="arabic" data-en="Arabic" data-ar="عربية">Arabic</option>
          <option value="english" data-en="English" data-ar="إنجليزية">English</option>
          <option value="universal" data-en="Universal" data-ar="عالمية">Universal</option>
        </select>
      </div>

      <div class="field">
        <label data-en="Severity" data-ar="شدة الضرر">Severity</label>
        <select id="f-severity">
          <option value="" data-en="-- select --" data-ar="-- اختر --">-- select --</option>
          <option value="safe" data-en="Safe" data-ar="آمن">Safe</option>
          <option value="mild" data-en="Mild" data-ar="خفيف">Mild</option>
          <option value="moderate" data-en="Moderate" data-ar="متوسط">Moderate</option>
          <option value="severe" data-en="Severe" data-ar="شديد">Severe</option>
        </select>
      </div>

      <div class="field">
        <label data-en="Target" data-ar="الفئة المستهدفة">Target</label>
        <select id="f-target">
          <option value="" data-en="-- select --" data-ar="-- اختر --">-- select --</option>
          <option value="none" data-en="No target" data-ar="بدون هدف">No target</option>
          <option value="individual" data-en="Individual" data-ar="فرد">Individual</option>
          <option value="protected_group" data-en="Protected group" data-ar="فئة محمية">Protected group</option>
          <option value="institution" data-en="Institution" data-ar="مؤسسة">Institution</option>
          <option value="behavior" data-en="Behavior" data-ar="سلوك">Behavior</option>
          <option value="event" data-en="Event" data-ar="حدث">Event</option>
          <option value="self" data-en="Self" data-ar="الذات">Self</option>
        </select>
      </div>

      <div class="field">
        <label data-en="Humor mechanism" data-ar="آلية الفكاهة">Humor mechanism</label>
        <select id="f-humor-mechanism">
          <option value="" data-en="-- select --" data-ar="-- اختر --">-- select --</option>
          <option value="pun" data-en="Pun" data-ar="تورية">Pun</option>
          <option value="irony" data-en="Irony" data-ar="مفارقة">Irony</option>
          <option value="exaggeration" data-en="Exaggeration" data-ar="مبالغة">Exaggeration</option>
          <option value="incongruity" data-en="Incongruity" data-ar="تنافر">Incongruity</option>
          <option value="sarcasm" data-en="Sarcasm" data-ar="تهكم">Sarcasm</option>
          <option value="slapstick" data-en="Slapstick" data-ar="كوميديا حركية">Slapstick</option>
          <option value="dark_twist" data-en="Dark twist" data-ar="منعطف قاتم">Dark twist</option>
          <option value="stereotype_based_humor" data-en="Stereotype-based humor" data-ar="فكاهة قائمة على الصورة النمطية">Stereotype-based humor</option>
          <option value="other" data-en="Other" data-ar="أخرى">Other</option>
        </select>
      </div>

      <div class="field">
        <label data-en="Annotator confidence" data-ar="درجة ثقة المُصنِّف">Annotator confidence</label>
        <select id="f-confidence">
          <option value="" data-en="-- select --" data-ar="-- اختر --">-- select --</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>

      <div class="field wide">
        <label data-en="Joke summary (one sentence: what is the joke?)" data-ar="ملخص النكتة (جملة واحدة: ما هي النكتة؟)">Joke summary (one sentence: what is the joke?)</label>
        <input type="text" id="f-joke-summary"
          placeholder="e.g. A husband deflects his wife's hypothetical question with a backhanded compliment."
          data-en-placeholder="e.g. A husband deflects his wife's hypothetical question with a backhanded compliment."
          data-ar-placeholder="مثال: زوج يتهرب من سؤال افتراضي لزوجته بمجاملة مبطنة.">
      </div>

      <div class="field wide">
        <label data-en="Why harmful / safe (one sentence)" data-ar="لماذا هي ضارة / آمنة (جملة واحدة)">Why harmful / safe (one sentence)</label>
        <input type="text" id="f-why"
          placeholder="e.g. Relies on a mother-in-law stereotype to imply she's unwanted."
          data-en-placeholder="e.g. Relies on a mother-in-law stereotype to imply she's unwanted."
          data-ar-placeholder="مثال: تعتمد على صورة نمطية عن الحماة لتوحي بأنها غير مرغوب بها.">
      </div>
    </div>

    <div class="nav-row">
      <button id="prev-btn" data-en="&larr; Previous" data-ar="السابق &rarr;">&larr; Previous</button>
      <span id="index-text"></span>
      <button id="next-btn" data-en="Next &rarr;" data-ar="&larr; التالي">Next &rarr;</button>
    </div>
  </main>

  <footer>
    <button id="export-btn" data-en="Export my annotations (JSON)" data-ar="تصدير تعليقاتي (JSON)">Export my annotations (JSON)</button>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
